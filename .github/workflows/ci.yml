name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        shell: bash
        run: |
          for dir in \
            apps/benchmark \
            apps/docs \
            apps/playground \
            packages/core \
            packages/react \
            packages/renderers \
            packages/renderers/image \
            packages/renderers/pdf \
            packages/renderers/rtf \
            packages/renderers/video \
            packages/theme \
            packages/web-component
          do
            (cd "$dir" && bun run lint)
          done
      - name: Typecheck
        shell: bash
        run: |
          for dir in \
            apps/benchmark \
            apps/docs \
            apps/playground \
            packages/core \
            packages/react \
            packages/renderers \
            packages/renderers/image \
            packages/renderers/pdf \
            packages/renderers/rtf \
            packages/renderers/video \
            packages/theme \
            packages/web-component
          do
            (cd "$dir" && bun run typecheck)
          done
      - name: Test (unit + coverage)
        run: bun run test:coverage
      - name: Build
        shell: bash
        run: |
          for dir in \
            packages/core \
            packages/react \
            packages/theme \
            packages/renderers \
            packages/web-component
          do
            (cd "$dir" && bun run build)
          done
      - name: React Doctor
        run: bun run doctor
        continue-on-error: true

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Component size check (≤200 lines)
        run: |
          find packages -name "*.tsx" -not -path "*/tests/*" -not -name "*.test.tsx" \
            -exec wc -l {} + | awk '$1 > 200 { print "ERROR: " $2 " has " $1 " lines"; exit 1 }'
      - name: JSDoc coverage
        run: bunx eslint . --ext .ts,.tsx --rule 'jsdoc/require-jsdoc: error'
      - name: No magic numbers/strings outside constants
        run: |
          ! grep -r "const.*=.*[0-9]\\{3,\\}" packages --include="*.ts" --include="*.tsx" | grep -v constants | grep -v test || true
      - name: No prohibited traces
        run: |
          ! grep -ri "generated\\|copilot\\|assistant" . \
            --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md" || true
      - name: Changeset present
        run: |
          if [ ! -f .changeset/*.md ]; then
            echo "❌ No changeset found. Run 'bunx changeset' to add version bump."
            exit 1
          fi

  a11y:
    name: Accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Build packages
        shell: bash
        run: |
          for dir in \
            packages/core \
            packages/react \
            packages/theme \
            packages/renderers \
            packages/web-component
          do
            (cd "$dir" && bun run build)
          done
      - run: bun run test:e2e --project=chromium --grep="@a11y"
        working-directory: apps/playground

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Build packages
        shell: bash
        run: |
          for dir in \
            packages/core \
            packages/react \
            packages/theme \
            packages/renderers \
            packages/web-component
          do
            (cd "$dir" && bun run build)
          done
      - name: Build Storybook
        shell: bash
        run: |
          for dir in \
            packages/react \
            packages/web-component
          do
            (cd "$dir" && bun run build-storybook)
          done

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Build packages
        shell: bash
        run: |
          for dir in \
            packages/core \
            packages/react \
            packages/theme \
            packages/renderers \
            packages/web-component
          do
            (cd "$dir" && bun run build)
          done
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:e2e
        working-directory: apps/playground
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  release:
    name: Release to npm
    runs-on: ubuntu-latest
    needs: [validate, quality, a11y, storybook, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: { contents: write, packages: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - run: bun install --frozen-lockfile
      - name: Build packages
        shell: bash
        run: |
          for dir in \
            packages/core \
            packages/react \
            packages/theme \
            packages/renderers \
            packages/web-component
          do
            (cd "$dir" && bun run build)
          done
      - run: bunx changeset publish
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}, GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
