name: Auto-generate PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const pr = context.payload.pull_request;
              if (!pr) {
                console.log('No PR context, skipping');
                return;
              }
              const isTemplate = pr.body && (
                pr.body.includes('<!-- Breve resumen') ||
                (pr.body.includes('### ✨ Funcionalidades') && pr.body.includes('- \n- \n\n### 🐛'))
              );
              // Skip only if has custom description (not template)
              if (pr.body && pr.body.length > 100 && !isTemplate) {
                console.log('PR already has custom description, skipping');
                return;
              }
              if (isTemplate) console.log('Template detected, generating...');
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Get commits
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Categorize changes
            const categories = {
              features: [],
              bugs: [],
              visual: [],
              technical: [],
              docs: [],
              tests: []
            };
            
            for (const file of files) {
              const path = file.filename;
              if (path.includes('/src/') && (path.includes('test') || path.includes('spec'))) {
                categories.tests.push(file.filename);
              } else if (path.endsWith('.css') || path.includes('tokens')) {
                categories.visual.push(file.filename);
              } else if (path.endsWith('.md')) {
                categories.docs.push(file.filename);
              } else if (file.status !== 'removed') {
                // All other changed files (added/modified/renamed)
                if (path.startsWith('packages/') || path.startsWith('apps/')) {
                  categories.features.push(file.filename);
                } else {
                  categories.technical.push(file.filename);
                }
              }
            }
            
            // Parse conventional commits for bugs/technical/docs
            for (const commit of commits) {
              const raw = commit.commit.message.split('\n')[0];
              if (raw.startsWith('fix')) {
                categories.bugs.push(raw.replace(/^fix(\([^)]+\))?:\s*/, ''));
              } else if (raw.startsWith('docs')) {
                const t = raw.replace(/^docs(\([^)]+\))?:\s*/, '');
                if (!categories.docs.includes(t)) categories.docs.push(t);
              } else if (raw.startsWith('chore') || raw.startsWith('refactor') || raw.startsWith('perf') || raw.startsWith('ci') || raw.startsWith('build')) {
                const t = raw.replace(/^(chore|refactor|perf|ci|build)(\([^)]+\))?:\s*/, '');
                if (!categories.technical.includes(t)) categories.technical.push(t);
              }
            }
            
            // Build description - always show all sections (empty = "-")
            let body = '## 📦 Cambios\n\n';
            const fmt = (arr) => arr.length ? arr.slice(0, 10).map(v => `- ${v}`).join('\n') : '-';
            body += `### ✨ Funcionalidades\n${fmt(categories.features)}\n\n`;
            body += `### 🐛 Bugs Resueltos\n${fmt(categories.bugs)}\n\n`;
            body += `### 🎨 Mejoras Visuales\n${fmt(categories.visual)}\n\n`;
            body += `### 🔧 Mejoras Técnicas\n${fmt(categories.technical)}\n\n`;
            body += `### 📚 Documentación\n${fmt(categories.docs)}\n\n`;
            body += `---\n*Auto-generado: ${files.length} archivos, ${commits.length} commits*`;
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: body
            });
            console.log('PR description updated');
            } catch (e) {
              console.log('Skip auto-description:', e.message);
            }
